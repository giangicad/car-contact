<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Liên hệ chủ xe</title>

<style>
* {
    box-sizing: border-box;
}

body {
    margin: 0;
    min-height: 100vh;
    display: flex;
    justify-content: center;
    align-items: center;
    background: #f2f2f2;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
}

.card {
    width: calc(100% - 32px);
    max-width: 420px;
    background: white;
    border-radius: 24px;
    padding: 36px 24px;
    text-align: center;
    box-shadow: 0 8px 30px rgba(0,0,0,0.10);
}

.title {
    font-size: 27px;
    font-weight: 700;
    margin-bottom: 32px;
}

.info {
    font-size: 18px;
    margin: 16px 0;
}

.label {
    color: #666;
}

.value {
    font-weight: 600;
}

.call {
    display: block;
    margin-top: 34px;
    padding: 18px;
    background: #16a34a;
    color: white;
    text-decoration: none;
    border-radius: 15px;
    font-size: 21px;
    font-weight: 700;
}

.call:active {
    transform: scale(0.98);
}
</style>
</head>

<body>

<div class="card">

    <div class="title">
        LIÊN HỆ CHỦ XE
    </div>

    <div class="info">
        <span class="label">Biển số:</span>
        <span class="value">30K-391.52</span>
    </div>

    <div class="info">
        <span class="label">Số điện thoại:</span>
        <span class="value">0904971401</span>
    </div>

    <a class="call" href="tel:0904971401">
        📞 GỌI NGAY
    </a>

</div>

</body>
</html>
