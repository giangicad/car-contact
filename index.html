<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Liên hệ chủ xe</title>

<style>
* {
    box-sizing: border-box;
}

body {
    margin: 0;
    min-height: 100vh;
    background: #f2f3f5;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Arial, sans-serif;
    display: flex;
    justify-content: center;
    align-items: center;
    padding: 20px;
}

.card {
    width: 100%;
    max-width: 430px;
    background: #ffffff;
    border-radius: 24px;
    overflow: hidden;
    box-shadow: 0 8px 30px rgba(0, 0, 0, 0.12);
}

.car-image {
    width: 100%;
    height: 230px;
    object-fit: cover;
    display: block;
}

.content {
    padding: 28px 24px 30px;
    text-align: center;
}

.title {
    font-size: 25px;
    font-weight: 750;
    color: #111111;
    margin-bottom: 22px;
}

.info {
    font-size: 18px;
    margin: 12px 0;
    color: #555555;
}

.value {
    color: #111111;
    font-weight: 650;
}

.buttons {
    margin-top: 28px;
    display: flex;
    flex-direction: column;
    gap: 12px;
}

.button {
    display: flex;
    justify-content: center;
    align-items: center;
    min-height: 54px;
    border-radius: 14px;
    text-decoration: none;
    font-size: 19px;
    font-weight: 700;
}

.call {
    background: #18a957;
    color: white;
}

.zalo {
    background: #0068ff;
    color: white;
}

.button:active {
    transform: scale(0.98);
}

.footer {
    margin-top: 22px;
    color: #999999;
    font-size: 13px;
}
</style>
</head>

<body>

<div class="card">

    <img
        class="car-image"
        src="https://images.summitmedia-digital.com/sap/images/2021/12/09/5-almera-1639020473.jpg"
        alt="Nissan Almera đỏ"
    >

    <div class="content">

        <div class="title">
            LIÊN HỆ CHỦ XE
        </div>

        <div class="info">
            Biển số:
            <span class="value">30K-391.52</span>
        </div>

        <div class="info">
            Số điện thoại:
            <span class="value">0904971401</span>
        </div>

        <div class="buttons">

            <a
                class="button call"
                href="tel:0904971401"
            >
                📞 GỌI NGAY
            </a>

            <a
                class="button zalo"
                href="https://zalo.me/0904971401"
                target="_blank"
            >
                💬 NHẮN TIN ZALO
            </a>

        </div>
