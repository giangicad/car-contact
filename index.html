```html
<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Liên hệ chủ xe</title>

<style>

/* =========================
   CÀI ĐẶT CHUNG
========================= */

* {
    box-sizing: border-box;
}

body {
    margin: 0;
    min-height: 100vh;

    background:
        radial-gradient(circle at top, #ffffff 0%, #eef0f3 45%, #dfe2e6 100%);

    font-family:
        -apple-system,
        BlinkMacSystemFont,
        "Segoe UI",
        Arial,
        sans-serif;

    display: flex;
    justify-content: center;
    align-items: center;

    padding: 20px;
}


/* =========================
   KHUNG CHÍNH
========================= */

.card {
    width: 100%;
    max-width: 430px;

    background: #ffffff;

    border-radius: 26px;

    overflow: hidden;

    box-shadow:
        0 20px 45px rgba(0, 0, 0, 0.16),
        0 5px 12px rgba(0, 0, 0, 0.08);
}


/* =========================
   ẢNH XE
========================= */

.car-image {
    width: 100%;
    height: 235px;

    object-fit: cover;

    display: block;
}


/* =========================
   NỘI DUNG
========================= */

.content {
    padding: 28px 24px 32px;

    text-align: center;
}


/* =========================
   TIÊU ĐỀ
========================= */

.title {
    font-size: 25px;

    font-weight: 800;

    letter-spacing: 0.5px;

    color: #111111;

    margin-bottom: 22px;
}


/* =========================
   BIỂN SỐ XE
========================= */

.license-label {
    font-size: 15px;

    color: #777777;

    margin-bottom: 8px;

    font-weight: 500;
}


/*
   Mô phỏng biển số ô tô Việt Nam
   dạng biển dài 520 x 110 mm
*/

.license-plate {

    position: relative;

    width: 100%;
    max-width: 350px;

    margin: 0 auto 24px;

    aspect-ratio: 520 / 110;

    background: #f7f7f7;

    border: 3px solid #202020;

    border-radius: 8px;

    /*
       hiệu ứng kim loại nhẹ
    */
    background:
        linear-gradient(
            180deg,
            #ffffff 0%,
            #f5f5f5 48%,
            #dedede 100%
        );

    /*
       viền ngoài + chiều sâu
    */
    box-shadow:

        inset 0 1px 1px rgba(255,255,255,0.9),

        inset 0 -3px 4px rgba(0,0,0,0.15),

        0 4px 8px rgba(0,0,0,0.25),

        0 1px 2px rgba(0,0,0,0.35);

    display: flex;

    justify-content: center;
    align-items: center;
}


/*
   Vạch viền đen bên trong biển
*/

.license-plate::before {

    content: "";

    position: absolute;

    inset: 6px;

    border: 2px solid #222222;

    border-radius: 4px;

    pointer-events: none;
}


/*
   Chữ biển số
*/

.license-number {

    position: relative;

    z-index: 2;

    font-family:
        "Arial Narrow",
        Arial,
        sans-serif;

    font-size: clamp(34px, 10vw, 52px);

    font-weight: 900;

    letter-spacing: 2px;

    color: #111111;

    /*
       tạo cảm giác chữ dập nổi
    */

    text-shadow:

        0 1px 0 #ffffff,

        0 2px 1px rgba(0,0,0,0.25),

        1px 1px 0 rgba(0,0,0,0.12);
}


/* =========================
   SỐ ĐIỆN THOẠI
========================= */

.phone-label {

    font-size: 15px;

    color: #777777;

    margin-bottom: 5px;
}

.phone-number {

    font-size: 23px;

    font-weight: 750;

    color: #111111;

    letter-spacing: 1px;

    margin-bottom: 26px;
}


/* =========================
   KHU VỰC NÚT
========================= */

.buttons {

    display: flex;

    flex-direction: column;

    gap: 16px;

    margin-top: 8px;
}


/* =========================
   NÚT 3D
========================= */

.button {

    position: relative;

    display: flex;

    justify-content: center;

    align-items: center;

    min-height: 60px;

    border-radius: 16px;

    text-decoration: none;

    font-size: 19px;

    font-weight: 800;

    letter-spacing: 0.2px;

    color: #ffffff;

    overflow: hidden;

    /*
       bóng phía dưới tạo độ nổi
    */

    box-shadow:
        0 7px 0 rgba(0,0,0,0.20),
        0 11px 18px rgba(0,0,0,0.20);

    transition:
        transform 0.12s ease,
        box-shadow 0.12s ease;
}


/*
   ánh sáng chạy phía trên nút
*/

.button::before {

    content: "";

    position: absolute;

    top: 0;
    left: 0;
    right: 0;

    height: 48%;

    background:
        linear-gradient(
            180deg,
            rgba(255,255,255,0.28),
            rgba(255,255,255,0.02)
        );

    pointer-events: none;
}


/*
   hiệu ứng hover trên máy tính
*/

.button:hover {

    transform: translateY(-2px);

    box-shadow:
        0 9px 0 rgba(0,0,0,0.18),
        0 15px 22px rgba(0,0,0,0.22);
}


/*
   hiệu ứng khi bấm
*/

.button:active {

    transform: translateY(6px);

    box-shadow:
        0 1px 0 rgba(0,0,0,0.20),
        0 4px 8px rgba(0,0,0,0.15);
}


/* =========================
   NÚT GỌI
========================= */

.call {

    background:
        linear-gradient(
            180deg,
            #25c76a 0%,
            #12a650 55%,
            #078b40 100%
        );

    border: 1px solid #087f3b;
}


/* =========================
   NÚT ZALO
========================= */

.zalo {

    background:
        linear-gradient(
            180deg,
            #1680ff 0%,
            #0068e8 55%,
            #0055c7 100%
        );

    border: 1px solid #0058ca;
}


/* =========================
   ICON
========================= */

.icon {

    font-size: 23px;

    margin-right: 10px;

    position: relative;

    z-index: 2;
}


/*
   chữ nằm trên lớp ánh sáng
*/

.button span {

    position: relative;

    z-index: 2;
}


/* =========================
   MOBILE
========================= */

@media (max-width: 380px) {

    body {
        padding: 12px;
    }

    .content {
        padding: 24px 18px 28px;
    }

    .title {
        font-size: 23px;
    }

    .license-number {
        font-size: 31px;
        letter-spacing: 1px;
    }

    .phone-number {
        font-size: 21px;
    }

    .button {
        min-height: 57px;
        font-size: 18px;
    }
}

</style>
</head>


<body>

<div class="card">

    <!-- ẢNH XE -->
    <img
        class="car-image"
        src="https://images.summitmedia-digital.com/sap/images/2021/12/09/5-almera-1639020473.jpg"
        alt="Nissan Almera"
    >


    <div class="content">

        <!-- TIÊU ĐỀ -->
        <div class="title">
            LIÊN HỆ CHỦ XE
        </div>


        <!-- BIỂN SỐ -->
        <div class="license-label">
            Biển số xe
        </div>

        <div class="license-plate">

            <div class="license-number">
                30K-391.52
            </div>

        </div>


        <!-- SỐ ĐIỆN THOẠI -->
        <div class="phone-label">
            Số điện thoại
        </div>

        <div class="phone-number">
            0904971401
        </div>


        <!-- NÚT -->
        <div class="buttons">

            <!-- GỌI -->
            <a
                class="button call"
                href="tel:0904971401"
            >
                <span class="icon">📞</span>
                <span>GỌI NGAY</span>
            </a>


            <!-- ZALO -->
            <a
                class="button zalo"
                href="https://zalo.me/0904971401"
                target="_blank"
            >
                <span class="icon">💬</span>
                <span>NHẮN TIN ZALO</span>
            </a>

        </div>

    </div>

</div>

</body>
</html>
```
