<!DOCTYPE html>
<html lang="vi">

<head>

<meta charset="UTF-8">

<meta
    name="viewport"
    content="width=device-width, initial-scale=1.0, viewport-fit=cover"
>

<!-- Ngăn iPhone/Safari tự biến số điện thoại thành link màu xanh -->
<meta name="format-detection" content="telephone=no">

<title>Liên hệ chủ xe</title>


<style>

/* =====================================================
   RESET
===================================================== */

* {
    box-sizing: border-box;
    -webkit-tap-highlight-color: transparent;
}

html,
body {
    margin: 0;
    padding: 0;
    width: 100%;
    min-height: 100%;
}


/* =====================================================
   BODY
===================================================== */

body {

    font-family:
        -apple-system,
        BlinkMacSystemFont,
        "Segoe UI",
        Roboto,
        Arial,
        sans-serif;

    min-height: 100dvh;

    background:
        radial-gradient(
            circle at 50% 0%,
            #ffffff 0%,
            #f1f3f5 48%,
            #dfe3e7 100%
        );

    display: flex;

    justify-content: center;
    align-items: center;

    padding:
        max(12px, env(safe-area-inset-top))
        max(12px, env(safe-area-inset-right))
        max(12px, env(safe-area-inset-bottom))
        max(12px, env(safe-area-inset-left));
}


/* =====================================================
   KHUNG CHÍNH
===================================================== */

.card {

    width: min(100%, 560px);

    background: #ffffff;

    border-radius:
        clamp(18px, 4vw, 30px);

    overflow: hidden;

    box-shadow:
        0 25px 60px rgba(0, 0, 0, 0.16),
        0 8px 20px rgba(0, 0, 0, 0.08);
}


/* =====================================================
   ẢNH XE
===================================================== */

.car-image {

    display: block;

    width: 100%;

    height:
        clamp(210px, 42vw, 330px);

    object-fit: cover;

    object-position: center;
}


/* =====================================================
   CONTENT
===================================================== */

.content {

    padding:
        clamp(22px, 5vw, 38px)
        clamp(18px, 5vw, 42px)
        clamp(24px, 5vw, 40px);

    text-align: center;
}


/* =====================================================
   TIÊU ĐỀ
===================================================== */

.title {

    font-size:
        clamp(23px, 6vw, 32px);

    line-height: 1.2;

    font-weight: 800;

    letter-spacing: 0.5px;

    color: #111111;

    margin:
        0 0
        clamp(20px, 5vw, 28px);
}


/* =====================================================
   NHÃN
===================================================== */

.info-label {

    font-size:
        clamp(14px, 3.8vw, 17px);

    color: #777777;

    font-weight: 500;

    margin-bottom: 8px;
}


/* =====================================================
   BIỂN SỐ XE
===================================================== */

.license-plate {

    position: relative;

    width: 100%;

    /*
       Tỷ lệ biển dài 520 x 110
    */

    aspect-ratio: 520 / 110;

    margin:
        0 auto
        clamp(22px, 5vw, 30px);

    overflow: hidden;

    display: flex;

    justify-content: center;

    align-items: center;


    /*
       Nền trắng phản quang
    */

    background:
        linear-gradient(
            180deg,
            #ffffff 0%,
            #fafafa 45%,
            #e7e7e7 100%
        );


    /*
       Viền ngoài
    */

    border:
        clamp(2px, 0.55vw, 3px)
        solid #151515;

    border-radius:
        clamp(5px, 1vw, 7px);


    /*
       Hiệu ứng nổi
    */

    box-shadow:

        inset 0 1px 2px rgba(255,255,255,0.95),

        inset 0 -4px 6px rgba(0,0,0,0.15),

        0 5px 10px rgba(0,0,0,0.25),

        0 2px 3px rgba(0,0,0,0.18);
}


/* =====================================================
   VIỀN TRONG BIỂN
===================================================== */

.license-plate::after {

    content: "";

    position: absolute;

    inset:
        clamp(4px, 0.9vw, 6px);

    border:
        1.5px solid rgba(25,25,25,0.9);

    border-radius: 4px;

    pointer-events: none;

    z-index: 8;
}


/* =====================================================
   HOA VĂN CHÌM
===================================================== */

.license-pattern {

    position: absolute;

    left: 2%;

    right: 2%;

    top: 10%;

    bottom: 10%;

    z-index: 1;

    opacity: 0.28;

    pointer-events: none;

    /*
       Các đường hoa văn mảnh
    */

    background-image:

        repeating-linear-gradient(
            0deg,
            transparent 0px,
            transparent 4px,
            rgba(80,80,80,0.20) 5px,
            transparent 6px
        ),

        repeating-linear-gradient(
            90deg,
            transparent 0px,
            transparent 15px,
            rgba(80,80,80,0.10) 16px,
            transparent 17px
        );

    /*
       Làm hoa văn giống dạng phản quang/chìm
    */

    mix-blend-mode: multiply;
}


/* =====================================================
   DẤU BẢO MẬT CHÌM
===================================================== */

.security-emblem {

    position: absolute;

    z-index: 3;

    top: 8%;

    left: 50%;

    transform: translateX(-50%);

    width:
        clamp(18px, 4vw, 25px);

    height:
        clamp(18px, 4vw, 25px);

    border-radius: 50%;

    border:
        1px solid rgba(60,60,60,0.25);

    display: flex;

    justify-content: center;

    align-items: center;

    opacity: 0.45;

    box-shadow:

        inset 1px 1px 2px rgba(255,255,255,0.95),

        inset -1px -1px 2px rgba(0,0,0,0.20);
}


/* =====================================================
   KÝ HIỆU CHÌM
===================================================== */

.security-emblem::before {

    content: "★";

    color:
        rgba(70,70,70,0.28);

    font-size:
        clamp(9px, 2vw, 13px);

    text-shadow:

        1px 1px 1px rgba(255,255,255,0.9),

        -1px -1px 1px rgba(0,0,0,0.15);
}


/* =====================================================
   ĐƯỜNG NGANG
===================================================== */

.plate-line {

    position: absolute;

    left: 7%;

    right: 7%;

    top: 49%;

    height: 1px;

    background:
        rgba(40,40,40,0.25);

    z-index: 2;
}


/* =====================================================
   SỐ BIỂN
===================================================== */

.license-number {

    position: relative;

    z-index: 5;

    width: 97%;

    text-align: center;

    white-space: nowrap;

    font-family:
        "Arial Narrow",
        Arial,
        sans-serif;

    /*
       Cùng kích thước với số điện thoại
    */

    font-size:
        clamp(28px, 8vw, 48px);

    line-height: 1;

    font-weight: 900;

    letter-spacing:
        clamp(0.5px, 0.25vw, 2px);

    color: #101010;

    text-shadow:

        0 1px 0 #ffffff,

        0 2px 0 rgba(255,255,255,0.6),

        1px 2px 1px rgba(0,0,0,0.25),

        0 3px 2px rgba(0,0,0,0.12);
}


/* =====================================================
   KHUNG SỐ ĐIỆN THOẠI
===================================================== */

.phone-box {

    width: 100%;

    margin:
        0 auto
        clamp(22px, 5vw, 30px);

    min-height:
        clamp(58px, 14vw, 72px);

    border-radius:
        clamp(10px, 2.5vw, 15px);

    display: flex;

    justify-content: center;

    align-items: center;

    /*
       Đỏ cờ Mỹ
    */

    background: #B22234;

    border:
        1px solid #941b2c;

    box-shadow:

        inset 0 1px 0 rgba(255,255,255,0.25),

        inset 0 -3px 5px rgba(0,0,0,0.15),

        0 5px 10px rgba(0,0,0,0.20);
}


/* =====================================================
   SỐ ĐIỆN THOẠI
===================================================== */

.phone-number {

    /*
       CÙNG SIZE VỚI BIỂN SỐ
    */

    font-size:
        clamp(28px, 8vw, 48px);

    line-height: 1;

    font-weight: 900;

    letter-spacing:
        clamp(1px, 0.4vw, 2px);

    white-space: nowrap;

    /*
       QUAN TRỌNG:
       ép màu trắng và bỏ gạch chân
    */

    color: #ffffff !important;

    text-decoration: none !important;

    -webkit-text-decoration: none !important;

    text-shadow:
        0 2px 2px rgba(0,0,0,0.20);
}


/*
   Chống mọi trường hợp Safari tự tạo link
*/

.phone-number,
.phone-number span,
.phone-number a,
.phone-number a:link,
.phone-number a:visited,
.phone-number a:hover,
.phone-number a:active {

    color: #ffffff !important;

    text-decoration: none !important;

    -webkit-text-decoration: none !important;
}


/* =====================================================
   KHU VỰC BUTTON
===================================================== */

.buttons {

    width: 100%;

    display: flex;

    flex-direction: column;

    gap:
        clamp(12px, 3vw, 16px);
}


/* =====================================================
   BUTTON 3D
===================================================== */

.button {

    position: relative;

    width: 100%;

    min-height:
        clamp(54px, 12vw, 62px);

    border-radius:
        clamp(13px, 3vw, 17px);

    display: flex;

    justify-content: center;

    align-items: center;

    text-decoration: none;

    color: #ffffff !important;

    font-size:
        clamp(17px, 4vw, 20px);

    font-weight: 800;

    overflow: hidden;

    box-shadow:

        0 6px 0 rgba(0,0,0,0.20),

        0 10px 18px rgba(0,0,0,0.20);

    transition:

        transform 0.12s ease,

        box-shadow 0.12s ease;
}


/* =====================================================
   ÁNH SÁNG
===================================================== */

.button::before {

    content: "";

    position: absolute;

    top: 0;

    left: 0;

    right: 0;

    height: 48%;

    background:
        linear-gradient(
            180deg,
            rgba(255,255,255,0.28),
            rgba(255,255,255,0.02)
        );

    pointer-events: none;
}


/* =====================================================
   ICON ĐIỆN THOẠI
===================================================== */

.phone-icon {

    position: relative;

    z-index: 2;

    width:
        22px;

    height:
        22px;

    margin-right: 9px;

    fill: currentColor;
}


/* =====================================================
   ICON ZALO
===================================================== */

.zalo-icon {

    position: relative;

    z-index: 2;

    width: 27px;

    height: 27px;

    margin-right: 9px;

    border-radius: 50%;

    background: #ffffff;

    color: #0068e8;

    display: flex;

    justify-content: center;

    align-items: center;

    font-family: Arial, sans-serif;

    font-size: 10px;

    font-weight: 900;

    letter-spacing: -0.6px;

    box-shadow:
        0 1px 2px rgba(0,0,0,0.20);
}


/* =====================================================
   BUTTON TEXT
===================================================== */

.button-text {

    position: relative;

    z-index: 2;
}


/* =====================================================
   NÚT GỌI
===================================================== */

.call {

    background:
        linear-gradient(
            180deg,
            #25c86b 0%,
            #12a650 55%,
            #078b40 100%
        );

    border:
        1px solid #087f3b;
}


/* =====================================================
   NÚT ZALO
===================================================== */

.zalo {

    background:
        linear-gradient(
            180deg,
            #1683ff 0%,
            #0068e8 55%,
            #0055c7 100%
        );

    border:
        1px solid #0058ca;
}


/* =====================================================
   DESKTOP HOVER
===================================================== */

@media (hover: hover) {

    .button:hover {

        transform: translateY(-3px);

        box-shadow:

            0 9px 0 rgba(0,0,0,0.18),

            0 15px 22px rgba(0,0,0,0.22);
    }
}


/* =====================================================
   KHI NHẤN
===================================================== */

.button:active {

    transform: translateY(5px);

    box-shadow:

        0 1px 0 rgba(0,0,0,0.20),

        0 4px 8px rgba(0,0,0,0.15);
}


/* =====================================================
   MÀN HÌNH LỚN
===================================================== */

@media (min-width: 900px) {

    body {
        padding: 30px;
    }

    .card {
        width: 560px;
    }

    .car-image {
        height: 330px;
    }
}


/* =====================================================
   ĐIỆN THOẠI NHỎ
===================================================== */

@media (max-width: 380px) {

    .content {

        padding-left: 15px;

        padding-right: 15px;
    }

    .license-number,
    .phone-number {

        font-size: 28px;
    }
}


/* =====================================================
   ĐIỆN THOẠI MÀN HÌNH THẤP
===================================================== */

@media (max-height: 700px) and (max-width: 600px) {

    .car-image {

        height: 175px;
    }

    .content {

        padding-top: 18px;

        padding-bottom: 22px;
    }

    .title {

        margin-bottom: 15px;
    }

    .license-plate {

        margin-bottom: 17px;
    }

    .phone-box {

        margin-bottom: 18px;
    }

    .button {

        min-height: 51px;
    }
}


/* =====================================================
   IPHONE / ANDROID SIÊU NHỎ
===================================================== */

@media (max-width: 340px) {

    .license-number,
    .phone-number {

        font-size: 25px;

        letter-spacing: 0.5px;
    }

    .title {

        font-size: 21px;
    }

    .button {

        font-size: 16px;
    }
}

</style>

</head>


<body>


<div class="card">


    <!-- =================================================
         ẢNH XE
    ================================================== -->

    <img
        class="car-image"
        src="https://images.summitmedia-digital.com/sap/images/2021/12/09/5-almera-1639020473.jpg"
        alt="Nissan Almera"
    >


    <div class="content">


        <!-- =================================================
             TIÊU ĐỀ
        ================================================== -->

        <div class="title">
            LIÊN HỆ CHỦ XE
        </div>


        <!-- =================================================
             BIỂN SỐ
        ================================================== -->

        <div class="info-label">
            Biển số xe
        </div>


        <div class="license-plate">


            <!-- HOA VĂN CHÌM -->

            <div class="license-pattern"></div>


            <!-- DẤU BẢO MẬT -->

            <div class="security-emblem"></div>


            <!-- GẠCH NGANG -->

            <div class="plate-line"></div>


            <!-- SỐ BIỂN -->

            <div class="license-number">
                30K-391.52
            </div>


        </div>


        <!-- =================================================
             SỐ ĐIỆN THOẠI
        ================================================== -->

        <div class="info-label">
            Số điện thoại
        </div>


        <div class="phone-box">

            <!--
               Tách số thành các span.
               Safari sẽ không tự biến thành link.
            -->

            <div class="phone-number">

                <span>0904</span><span>.</span><span>971</span><span>.</span><span>401</span>

            </div>

        </div>


        <!-- =================================================
             BUTTON
        ================================================== -->

        <div class="buttons">


            <!-- =================================================
                 GỌI NGAY
            ================================================== -->

            <a
                class="button call"
                href="tel:0904971401"
                aria-label="Gọi ngay cho chủ xe"
            >

                <!-- ICON ĐIỆN THOẠI SVG -->

                <svg
                    class="phone-icon"
                    viewBox="0 0 24 24"
                    aria-hidden="true"
                >

                    <path d="
                        M6.62 10.79
                        c1.44 2.83 3.76 5.15 6.59 6.59
                        l2.2-2.2
                        c.27-.27.67-.36 1.02-.24
                        c1.12.37 2.33.57 3.57.57
                        c.55 0 1 .45 1 1V20
                        c0 .55-.45 1-1 1
                        C10.61 21 3 13.39 3 4
                        c0-.55.45-1 1-1h3.5
                        c.55 0 1 .45 1 1
                        c0 1.25.2 2.45.57 3.57
                        c.11.35.03.74-.25 1.02
                        l-2.2 2.2z
                    "/>

                </svg>


                <span class="button-text">
                    GỌI NGAY
                </span>

            </a>


            <!-- =================================================
                 ZALO
            ================================================== -->

            <a
                class="button zalo"
                href="https://zalo.me/0904971401"
                target="_blank"
                rel="noopener"
                aria-label="Nhắn tin Zalo"
            >

                <!-- ICON ZALO -->

                <span class="zalo-icon">
                    Zalo
                </span>


                <span class="button-text">
                    NHẮN TIN ZALO
                </span>

            </a>


        </div>


    </div>


</div>


</body>

</html>
