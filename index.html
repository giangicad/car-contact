<!DOCTYPE html>
<html lang="vi">
<head>

<meta charset="UTF-8">

<meta
    name="viewport"
    content="width=device-width, initial-scale=1.0, viewport-fit=cover"
>

<title>Liên hệ chủ xe</title>


<style>

/* =====================================================
   RESET
===================================================== */

* {
    box-sizing: border-box;
    -webkit-tap-highlight-color: transparent;
}

html,
body {
    margin: 0;
    padding: 0;
    width: 100%;
    min-height: 100%;
}


/* =====================================================
   BODY
===================================================== */

body {

    font-family:
        -apple-system,
        BlinkMacSystemFont,
        "Segoe UI",
        Roboto,
        Arial,
        sans-serif;

    background:
        radial-gradient(
            circle at 50% 0%,
            #ffffff 0%,
            #f1f3f5 45%,
            #dfe3e7 100%
        );

    color: #111;

    min-height: 100dvh;

    display: flex;
    justify-content: center;
    align-items: center;

    padding:
        max(12px, env(safe-area-inset-top))
        max(12px, env(safe-area-inset-right))
        max(12px, env(safe-area-inset-bottom))
        max(12px, env(safe-area-inset-left));
}


/* =====================================================
   KHUNG TRANG
===================================================== */

.card {

    width: min(100%, 560px);

    background: #ffffff;

    border-radius: clamp(18px, 4vw, 30px);

    overflow: hidden;

    box-shadow:
        0 25px 60px rgba(0, 0, 0, 0.16),
        0 8px 20px rgba(0, 0, 0, 0.08);
}


/* =====================================================
   ẢNH XE
===================================================== */

.car-image {

    display: block;

    width: 100%;

    /*
       Trên điện thoại:
       ảnh rộng toàn màn hình card.

       Trên máy tính:
       chiều cao tăng nhưng vẫn giữ tỷ lệ đẹp.
    */

    height: clamp(210px, 42vw, 330px);

    object-fit: cover;

    object-position: center;
}


/* =====================================================
   NỘI DUNG
===================================================== */

.content {

    padding:
        clamp(22px, 5vw, 38px)
        clamp(18px, 5vw, 42px)
        clamp(24px, 5vw, 40px);

    text-align: center;
}


/* =====================================================
   TIÊU ĐỀ
===================================================== */

.title {

    font-size:
        clamp(23px, 6vw, 32px);

    line-height: 1.2;

    font-weight: 800;

    letter-spacing: 0.5px;

    margin: 0 0 clamp(20px, 5vw, 30px);

    color: #111;
}


/* =====================================================
   NHÃN
===================================================== */

.info-label {

    font-size:
        clamp(14px, 3.8vw, 17px);

    color: #777;

    font-weight: 500;

    margin-bottom: 8px;
}


/* =====================================================
   BIỂN SỐ
===================================================== */

.license-plate {

    position: relative;

    width: min(100%, 400px);

    /*
       Tỷ lệ biển số ô tô dài
    */

    aspect-ratio: 520 / 110;

    margin:
        0 auto
        clamp(20px, 5vw, 30px);

    display: flex;

    justify-content: center;

    align-items: center;


    /*
       Mặt biển
    */

    background:
        linear-gradient(
            180deg,
            #ffffff 0%,
            #f8f8f8 45%,
            #e5e5e5 100%
        );


    /*
       Viền ngoài
    */

    border:
        clamp(2px, 0.6vw, 3px)
        solid #202020;

    border-radius:
        clamp(5px, 1.2vw, 8px);


    /*
       Hiệu ứng nổi
    */

    box-shadow:

        inset 0 1px 2px rgba(255,255,255,0.95),

        inset 0 -4px 6px rgba(0,0,0,0.15),

        0 5px 10px rgba(0,0,0,0.25),

        0 2px 3px rgba(0,0,0,0.18);
}


/*
   Viền đen phía trong
*/

.license-plate::before {

    content: "";

    position: absolute;

    inset:
        clamp(5px, 1.2vw, 7px);

    border:
        2px solid #222;

    border-radius: 4px;

    pointer-events: none;
}


/* =====================================================
   SỐ BIỂN
===================================================== */

.license-number {

    position: relative;

    z-index: 2;

    /*
       KÍCH THƯỚC ĐỒNG BỘ VỚI SỐ ĐIỆN THOẠI
    */

    font-size:
        clamp(28px, 8vw, 48px);

    line-height: 1;

    font-family:
        "Arial Narrow",
        Arial,
        sans-serif;

    font-weight: 900;

    letter-spacing:
        clamp(1px, 0.5vw, 3px);

    color: #111;

    text-shadow:
        0 1px 0 #fff,
        0 2px 1px rgba(0,0,0,0.22);
}


/* =====================================================
   SỐ ĐIỆN THOẠI
===================================================== */

.phone-number {

    /*
       CỐ TÌNH BẰNG ĐÚNG SIZE VỚI BIỂN SỐ
    */

    font-size:
        clamp(28px, 8vw, 48px);

    line-height: 1;

    font-weight: 900;

    letter-spacing:
        clamp(1px, 0.4vw, 2px);

    color: #111;

    margin:
        0 auto
        clamp(22px, 5vw, 30px);

    /*
       Đảm bảo số không bị xuống dòng
    */

    white-space: nowrap;
}


/* =====================================================
   KHU VỰC BUTTON
===================================================== */

.buttons {

    width: 100%;

    display: flex;

    flex-direction: column;

    gap:
        clamp(12px, 3vw, 17px);

    margin-top: 8px;
}


/* =====================================================
   BUTTON 3D
===================================================== */

.button {

    position: relative;

    width: 100%;

    min-height:
        clamp(56px, 14vw, 68px);

    border-radius:
        clamp(13px, 3vw, 18px);

    display: flex;

    justify-content: center;

    align-items: center;

    text-decoration: none;

    color: #ffffff;

    font-size:
        clamp(17px, 4.5vw, 21px);

    font-weight: 800;

    letter-spacing: 0.2px;

    overflow: hidden;

    /*
       ĐỘ NỔI 3D
    */

    box-shadow:
        0 7px 0 rgba(0,0,0,0.20),
        0 12px 20px rgba(0,0,0,0.20);

    transition:
        transform 0.12s ease,
        box-shadow 0.12s ease;
}


/* =====================================================
   ÁNH SÁNG TRÊN BUTTON
===================================================== */

.button::before {

    content: "";

    position: absolute;

    top: 0;
    left: 0;
    right: 0;

    height: 50%;

    background:
        linear-gradient(
            180deg,
            rgba(255,255,255,0.30),
            rgba(255,255,255,0.03)
        );

    pointer-events: none;
}


/* =====================================================
   ICON
===================================================== */

.icon {

    position: relative;

    z-index: 2;

    font-size:
        clamp(21px, 5vw, 25px);

    margin-right: 10px;
}


/* =====================================================
   TEXT BUTTON
===================================================== */

.button-text {

    position: relative;

    z-index: 2;
}


/* =====================================================
   NÚT GỌI
===================================================== */

.call {

    background:
        linear-gradient(
            180deg,
            #27c96d 0%,
            #13a752 55%,
            #078c40 100%
        );

    border: 1px solid #087f3b;
}


/* =====================================================
   NÚT ZALO
===================================================== */

.zalo {

    background:
        linear-gradient(
            180deg,
            #1684ff 0%,
            #0068e8 55%,
            #0055c7 100%
        );

    border: 1px solid #0058ca;
}


/* =====================================================
   HIỆU ỨNG PC
===================================================== */

@media (hover: hover) {

    .button:hover {

        transform: translateY(-3px);

        box-shadow:
            0 10px 0 rgba(0,0,0,0.18),
            0 17px 25px rgba(0,0,0,0.22);
    }
}


/* =====================================================
   HIỆU ỨNG KHI BẤM
===================================================== */

.button:active {

    transform: translateY(6px);

    box-shadow:
        0 1px 0 rgba(0,0,0,0.20),
        0 4px 8px rgba(0,0,0,0.15);
}


/* =====================================================
   MÀN HÌNH RẤT LỚN
===================================================== */

@media (min-width: 900px) {

    body {

        padding: 30px;
    }

    .card {

        width: 560px;
    }

    .car-image {

        height: 330px;
    }
}


/* =====================================================
   MÀN HÌNH ĐIỆN THOẠI NHỎ
===================================================== */

@media (max-width: 380px) {

    .content {

        padding-left: 16px;
        padding-right: 16px;
    }

    .license-number,
    .phone-number {

        font-size: 28px;
    }
}


/* =====================================================
   ĐIỆN THOẠI MÀN HÌNH THẤP
===================================================== */

@media (max-height: 700px) and (max-width: 600px) {

    .car-image {

        height: 180px;
    }

    .content {

        padding-top: 18px;
        padding-bottom: 22px;
    }

    .title {

        margin-bottom: 16px;
    }

    .license-plate {

        margin-bottom: 16px;
    }

    .phone-number {

        margin-bottom: 18px;
    }

    .button {

        min-height: 52px;
    }
}

</style>

</head>


<body>


<div class="card">


    <!-- =================================================
         ẢNH XE
    ================================================== -->

    <img
        class="car-image"
        src="https://images.summitmedia-digital.com/sap/images/2021/12/09/5-almera-1639020473.jpg"
        alt="Nissan Almera"
    >


    <div class="content">


        <!-- =================================================
             TIÊU ĐỀ
        ================================================== -->

        <div class="title">
            LIÊN HỆ CHỦ XE
        </div>


        <!-- =================================================
             BIỂN SỐ
        ================================================== -->

        <div class="info-label">
            Biển số xe
        </div>


        <div class="license-plate">

            <div class="license-number">
                30K-391.52
            </div>

        </div>


        <!-- =================================================
             SỐ ĐIỆN THOẠI
        ================================================== -->

        <div class="info-label">
            Số điện thoại
        </div>


        <div class="phone-number">
            0904-971-401
        </div>


        <!-- =================================================
             BUTTON
        ================================================== -->

        <div class="buttons">


            <!-- GỌI -->

            <a
                class="button call"
                href="tel:0904971401"
            >

                <span class="icon">
                    📞
                </span>

                <span class="button-text">
                    GỌI NGAY
                </span>

            </a>


            <!-- ZALO -->

            <a
                class="button zalo"
                href="https://zalo.me/0904971401"
                target="_blank"
                rel="noopener"
            >

                <span class="icon">
                    💬
                </span>

                <span class="button-text">
                    NHẮN TIN ZALO
                </span>

            </a>


        </div>


    </div>


</div>


</body>
</html>
